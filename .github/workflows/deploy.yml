name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Fix static HTML base paths
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          sed -i "s|/portfolio/|/${REPO_NAME}/|g" public/resume.html public/cover-letter.html
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A Pages deployment stuck "in progress" blocks every later deploy, so cancel any
      # left over from earlier commits. Best-effort: it must never block this deploy.
      - name: Cancel stale in-progress Pages deployments
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner, repo, environment: 'github-pages', per_page: 20,
            });
            for (const d of deployments) {
              if (d.sha === context.sha) continue; // this run's own deployment
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner, repo, deployment_id: d.id, per_page: 1,
              });
              if (!['in_progress', 'queued', 'pending'].includes(statuses[0]?.state)) continue;
              try {
                await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id: d.sha });
                core.info(`Cancelled stale Pages deployment for ${d.sha}`);
              } catch (e) {
                core.info(`Could not cancel Pages deployment for ${d.sha}: ${e.status} ${e.message}`);
              }
            }

      - uses: actions/deploy-pages@v4
        id: deployment
